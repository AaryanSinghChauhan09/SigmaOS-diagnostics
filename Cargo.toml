[package]
name = "sigmaos-diagnostics"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "System diagnostics and troubleshooting"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-diagnostics"
readme = "README.md"
keywords = ["diagnostics", "troubleshoot", "debug"]
categories = ["development-tools"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }

[profile.release]
opt-level = 3
